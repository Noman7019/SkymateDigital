name: Deploy to Hostinger
# Manual only for now: Actions tab -> "Deploy to Hostinger" -> Run workflow.
on:
  workflow_dispatch:
concurrency: { group: hostinger-deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Check required files and secrets
        env:
          BLOG_ADMIN_BCRYPT: ${{ secrets.BLOG_ADMIN_BCRYPT }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR || 'public_html/' }}
        run: |
          test -f dist/.htaccess && test -f dist/api/blog.php && test -f dist/api/render.php && test -f dist/api/pages.php && test -f dist/assets/.htaccess
          case "$FTP_REMOTE_DIR" in */) ;; *) echo "::error::FTP_REMOTE_DIR must end with a slash (e.g. public_html/)"; exit 1;; esac
          echo "Deploying to remote dir: $FTP_REMOTE_DIR (FTP root = /home/u986473291/domains/skymatedigital.com)"
          case "$BLOG_ADMIN_BCRYPT" in '$2'*) ;; *) echo "::error::Secret BLOG_ADMIN_BCRYPT missing or not a bcrypt hash"; exit 1;; esac
          for f in $(find dist/api -name '*.php'); do php -l "$f" >/dev/null; done
      - name: Write server config (admin bcrypt hash; denied to the web by api/.htaccess)
        env:
          BLOG_ADMIN_BCRYPT: ${{ secrets.BLOG_ADMIN_BCRYPT }}
          # Optional. Empty = auto: ../smd-blog-data if open_basedir allows it, else public_html/api/data (denied by .htaccess).
          BLOG_DATA_DIR: ${{ vars.BLOG_DATA_DIR || secrets.BLOG_DATA_DIR || '' }}
        run: |
          php -r 'file_put_contents("dist/api/config.php", "<?php\n// Generated at deploy time. Do not commit.\nreturn " . var_export(["admin_user" => "admin", "admin_hash" => getenv("BLOG_ADMIN_BCRYPT"), "data_dir" => (string)getenv("BLOG_DATA_DIR"), "site_url" => "https://skymatedigital.com"], true) . ";\n");'
          chmod 600 dist/api/config.php
      - name: FTP deploy (never deletes remote files; never touches blog data/uploads)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR || 'public_html/' }}   # relative to FTP root (domains/skymatedigital.com)
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            api/data/**
            api/config.local.php
            uploads/blog/**
            **/*.log
            **/.DS_Store
            smd-blog-data/**
